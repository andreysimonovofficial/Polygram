[package]
name = "polygram-canvas"
description = "GPU-холст Polygram: камера, рендер карточек и ортогональных линий, сменная тема."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.29"
polygram-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
