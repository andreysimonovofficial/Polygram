[package]
name = "polygram-shell"
description = "Окно egui Polygram: меню, палитра команд, строка статуса, холст."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polygram-shell"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde_json = "1"
polygram-core = { path = "../core" }
polygram-canvas = { path = "../canvas" }
