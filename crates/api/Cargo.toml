[package]
name = "polygram-api"
description = "HTTP и MCP API поверх ядра Polygram: срезы контекста, команды, права и области."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polygram-api"
path = "src/main.rs"

[dependencies]
polygram-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = "2"
chrono = "0.4"
