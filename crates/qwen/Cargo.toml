[package]
name = "polygram-qwen"
description = "Локальный Qwen-агент Polygram: читает общий чат, отвечает через Ollama, создаёт объекты через MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qwen-agent"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
