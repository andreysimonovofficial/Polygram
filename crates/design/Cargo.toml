[package]
name = "polygram-design"
description = "Инструмент дизайна Polygram: Figma-подобный редактор визуальных стилей для объектов холста."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polygram-design"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
polygram-core = { path = "../core" }
polygram-canvas = { path = "../canvas" }

[lib]
doctest = false
