[package]
name = "polygram"
description = "Оболочка egui Polygram: главное окно, меню, холст."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polygram"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
egui-lucide = "0.2.0"
image = "0.25"
polygram-canvas = { path = "../canvas" }

[lints.rust]
missing_docs = "warn"