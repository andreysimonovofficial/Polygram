[package]
name = "polygram-canvas"
description = "Холст Polygram: фон, точечная сетка, рендер карточек процессов и контейнеров показателей."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.37"
egui-lucide = "0.2.0"
polygram-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
doctest = false

[lints.rust]
missing_docs = "warn"
