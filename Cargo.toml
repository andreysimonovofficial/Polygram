[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/canvas", "crates/polygram", "crates/api", "crates/design", "crates/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
