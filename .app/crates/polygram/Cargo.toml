[package]
name = "polygram"
description = "Окно egui Polygram: меню, палитра команд, строка статуса, холст."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polygram"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
egui-lucide = "0.2.0"
image = "0.25"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
polygram-core = { path = "../core" }
polygram-canvas = { path = "../canvas" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
chrono = "0.4"
rfd = "0.14"
serde_yaml = "0.9"
base64 = "0.22"
thiserror = "1"
